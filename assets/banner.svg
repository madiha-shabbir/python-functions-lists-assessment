<text x="626" y="100" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="13" xml:space="preserve"><tspan fill="#E2E8F0"></tspan><tspan fill="#F0ABFC">def </tspan><tspan fill="#7DD3FC">get_grade</tspan><tspan fill="#E2E8F0">(percentage):</tspan></text><text x="626" y="124" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="13" xml:space="preserve"><tspan fill="#E2E8F0">    </tspan><tspan fill="#F0ABFC">for </tspan><tspan fill="#E2E8F0">minimum, grade </tspan><tspan fill="#F0ABFC">in </tspan><tspan fill="#E2E8F0">GRADE_BANDS:</tspan></text><text x="626" y="148" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="13" xml:space="preserve"><tspan fill="#E2E8F0">        </tspan><tspan fill="#F0ABFC">if </tspan><tspan fill="#E2E8F0">percentage &gt;= minimum:</tspan></text><text x="626" y="172" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="13" xml:space="preserve"><tspan fill="#E2E8F0">            </tspan><tspan fill="#F0ABFC">return </tspan><tspan fill="#E2E8F0">grade</tspan></text><text x="626" y="196" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="13" xml:space="preserve"><tspan fill="#E2E8F0">    </tspan><tspan fill="#F0ABFC">return </tspan><tspan fill="#86EFAC">"Fail"</tspan></text>
